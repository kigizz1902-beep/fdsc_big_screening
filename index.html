<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빅활동: 민활기 다큐 상영회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 사이드바 (데스크톱) -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-emoji">🎬</span>
        <div class="brand-text">
          <strong>빅활동</strong>
          <small>민활기 다큐 상영회</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="calendar"><span class="nav-ico">📅</span><span class="nav-label">캘린더</span></button>
        <button class="nav-item" data-view="minutes"><span class="nav-ico">📝</span><span class="nav-label">회의록</span></button>
        <button class="nav-item" data-view="cinemas"><span class="nav-ico">🎞️</span><span class="nav-label">영화관 리스트</span></button>
        <button class="nav-item" data-view="ideas"><span class="nav-ico">💡</span><span class="nav-label">아이디어(메모)</span></button>
        <button class="nav-item" data-view="accounting"><span class="nav-ico">💰</span><span class="nav-label">회계 시트</span></button>
        <button class="nav-item" data-view="timestamps"><span class="nav-ico">⏱️</span><span class="nav-label">타임스탬프</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sync-status" id="syncStatus"></div>
        <button class="btn btn-ghost btn-block" id="backupAllBtn">🔄 백업 · 복원</button>
      </div>
    </aside>

    <!-- 메인 -->
    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">캘린더</h1>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <div class="view" id="view"></div>
    </main>

    <!-- 하단 탭 (모바일) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="bn-item active" data-view="calendar"><span>📅</span><em>캘린더</em></button>
      <button class="bn-item" data-view="minutes"><span>📝</span><em>회의록</em></button>
      <button class="bn-item" data-view="cinemas"><span>🎞️</span><em>영화관</em></button>
      <button class="bn-item" data-view="ideas"><span>💡</span><em>메모</em></button>
      <button class="bn-item" data-view="accounting"><span>💰</span><em>회계</em></button>
      <button class="bn-item" data-view="timestamps"><span>⏱️</span><em>시간</em></button>
    </nav>
  </div>

  <!-- 모달 루트 -->
  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">제목</h2>
        <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 백업 불러오기용 숨김 파일 입력 -->
  <input type="file" id="importFile" accept=".json,.xlsx" hidden />

  <!-- 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="js/timesheets.js"></script>
  <script src="js/accounting.js"></script>
  <script src="js/ideas.js"></script>
  <script src="js/cinemas.js"></script>
  <script src="js/meetings.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
